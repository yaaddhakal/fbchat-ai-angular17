<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-md relative max-h-[90vh] overflow-y-auto">

    <!-- Close -->
    <button (click)="dismiss()"
            class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl font-bold">
      ✕
    </button>

    <h2 class="text-xl font-semibold mb-6 text-center text-gray-800">Create Tenant Account</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Tenant -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Tenant</label>
        <ng-select
          [items]="tenants"
          bindLabel="tenantName"
          placeholder="Select or type new tenant"
          [addTag]="true"
          addTagText="+ Add new tenant: "
          (change)="onTenantChange($event)"
          class="ng-custom">
        </ng-select>
      </div>

      <!-- Industry (only after tenant picked) -->
      <div *ngIf="showIndustry">
        <label class="block text-sm font-medium text-gray-600 mb-1">
          Industry
          <span class="text-gray-400 font-normal text-xs ml-1">(blank = same as tenant)</span>
        </label>
        <ng-select
          [items]="industries"
          bindLabel="industryName"
          placeholder="Select or type new industry"
          [addTag]="true"
          addTagText="+ Add new industry: "
          (change)="onIndustryChange($event)"
          class="ng-custom">
        </ng-select>
      </div>

      <!-- Username -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Username</label>
        <input formControlName="userName" type="text" placeholder="Enter username"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-[#f9f9ff]
                      text-gray-800 placeholder-gray-400 focus:outline-none
                      focus:ring-2 focus:ring-purple-400" />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
        <input formControlName="email" type="email" placeholder="Enter email"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-[#f9f9ff]
                      text-gray-800 placeholder-gray-400 focus:outline-none
                      focus:ring-2 focus:ring-purple-400" />
        <p *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
           class="text-red-500 text-xs mt-1">Valid email required</p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
        <input formControlName="password" type="password" placeholder="Enter password"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-[#f9f9ff]
                      text-gray-800 placeholder-gray-400 focus:outline-none
                      focus:ring-2 focus:ring-purple-400" />
        <p *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
           class="text-red-500 text-xs mt-1">Min 6 characters</p>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Confirm Password</label>
        <input formControlName="confirmPassword" type="password" placeholder="Re-enter password"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-[#f9f9ff]
                      text-gray-800 placeholder-gray-400 focus:outline-none
                      focus:ring-2 focus:ring-purple-400" />
        <p *ngIf="pwMismatch" class="text-red-500 text-xs mt-1">
          Passwords do not match
        </p>
      </div>

      <!-- Submit -->
      <button type="submit" [disabled]="form.invalid"
              class="w-full bg-purple-600 text-white px-6 py-3 rounded-lg font-semibold
                     hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed
                     transition duration-200">
        Create Account
      </button>

    </form>

    <!-- Error -->
    <div [hidden]="!errorMessage" class="text-red-500 text-sm mt-3 text-center">
      {{ errorMessage }}
    </div>

  </div>
</div>
