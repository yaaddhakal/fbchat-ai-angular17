<div class="flex min-h-screen bg-gray-900 text-gray-100">
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-800 text-gray-200 flex flex-col justify-between">
    <!-- Logo -->
    <div class="p-6 border-b border-gray-700">
      <h2 class="text-xl font-bold text-blue-400">SysControl</h2>
      <p class="text-sm text-gray-400">Admin Platform</p>
    </div>

    <!-- Menu Groups -->
    <div class="flex-1 overflow-y-auto">
      <!-- Overview -->
      <div class="mt-6 px-6">
        <h3 class="text-xs uppercase text-gray-400 mb-2">Overview</h3>
        <nav class="space-y-1">
          <a routerLink="/sys-dashboard" routerLinkActive="bg-blue-600 text-white"
             class="block px-3 py-2 rounded hover:bg-gray-700">Dashboard</a>
          <a routerLink="/analytics" routerLinkActive="bg-blue-600 text-white"
             class="block px-3 py-2 rounded hover:bg-gray-700">Analytics</a>
          <a routerLink="/reports" routerLinkActive="bg-blue-600 text-white"
             class="block px-3 py-2 rounded hover:bg-gray-700">Reports</a>
        </nav>
      </div>

      <!-- Management -->
      <div class="mt-6 px-6">
        <h3 class="text-xs uppercase text-gray-400 mb-2">Management</h3>
        <nav class="space-y-1">
          <a routerLink="/create-tenant" class="flex items-center justify-between px-3 py-2 rounded hover:bg-gray-700">
            <span>Create Tenant</span>
            <span class="bg-blue-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">+</span>
          </a>
          <a routerLink="/tenants" routerLinkActive="bg-blue-600 text-white"
             class="block px-3 py-2 rounded hover:bg-gray-700">All Tenants</a>
          <a routerLink="/settings" routerLinkActive="bg-blue-600 text-white"
             class="block px-3 py-2 rounded hover:bg-gray-700">Settings</a>
        </nav>
      </div>

      <!-- System -->
      <div class="mt-6 px-6">
        <h3 class="text-xs uppercase text-gray-400 mb-2">System</h3>
        <nav class="space-y-1">
          <a routerLink="/audit-logs" routerLinkActive="bg-blue-600 text-white"
             class="block px-3 py-2 rounded hover:bg-gray-700">Audit Logs</a>
          <a routerLink="/security" routerLinkActive="bg-blue-600 text-white"
             class="block px-3 py-2 rounded hover:bg-gray-700">Security</a>
        </nav>
      </div>
    </div>

    <!-- Switch Button -->
    <div class="p-6 border-t border-gray-700">
      <button (click)="switchToTenant()"
        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold py-2 px-4 rounded hover:opacity-90 transition">
        Switch to Tenant Dashboard
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <!-- Header -->
    <header class="bg-gray-800 px-6 py-4 flex justify-between items-center border-b border-gray-700">
      <h1 class="text-lg font-semibold">
        Welcome, {{ userView?.userName || 'Admin' }}!
      </h1>
      <button (click)="logout()"
        class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded transition">
        Logout
      </button>
    </header>

    <!-- Content -->
    <main class="flex-1 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
